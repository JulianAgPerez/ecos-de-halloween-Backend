spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is created by Flyway (db/migration/h2) and validated by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# NOTE: this file shadows src/main/resources/application.properties in tests,
# so any spring.flyway.* override needed for tests must be repeated here.
spring.flyway.locations=classpath:db/migration/{vendor}

application.secret-key=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItZWNvcy1kZS1oYWxsb3dlZW4tYXVkaXQtMjAyNi0wMTIzNDU2Nzg5
application.expiration=3600000
application.refresh-expiration=604800000

cors.allowed.origins=http://localhost:5173

wikisource.api.base-url=https://es.wikisource.org
wikisource.user-agent=EcosDeHalloweenTest/0.1
classic.cache.ttl=86400000
classic.min-body-length=1
