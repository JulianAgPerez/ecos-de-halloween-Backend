spring.application.name=ecos de halloween Back

#JWT
application.secret-key=${JWT_SECRET_KEY}
application.expiration=${JWT_EXPIRATION:86400000}
application.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#Configuracion supabase

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update

# Límites de subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Wikisource (historias clásicas)
wikisource.api.base-url=${WIKISOURCE_API_BASE_URL:https://es.wikisource.org}
wikisource.user-agent=${WIKISOURCE_USER_AGENT:EcosDeHalloween/0.1}
classic.cache.ttl=${CLASSIC_CACHE_TTL:86400000}

# puerto de ejecución
server.port=8080
