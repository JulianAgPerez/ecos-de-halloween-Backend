spring.application.name=ecos de halloween Back

#JWT
application.secret-key=${JWT_SECRET_KEY}
application.expiration=${JWT_EXPIRATION:3600000}
application.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Rate limiting for /auth/login and /auth/refresh (per client IP per minute).
application.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:10}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#Configuracion supabase

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JPA
# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Baseline an existing non-empty schema (current prod DB) instead of failing;
# V1 is marked as applied on that DB and only runs on fresh databases.
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/{vendor}

# Límites de subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Wikisource (historias clásicas)
wikisource.api.base-url=${WIKISOURCE_API_BASE_URL:https://es.wikisource.org}
wikisource.user-agent=${WIKISOURCE_USER_AGENT:EcosDeHalloween/0.1}
classic.cache.ttl=${CLASSIC_CACHE_TTL:86400000}
classic.min-body-length=${CLASSIC_MIN_BODY_LENGTH:1000}

# puerto de ejecución
server.port=8080
