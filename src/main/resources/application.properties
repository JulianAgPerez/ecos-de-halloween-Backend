spring.application.name=ecos de halloween Back

#JWT
application.secret-key=${JWT_SECRET_KEY}
application.expiration=${JWT_EXPIRATION:3600000}
application.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Rate limiting for /auth/login and /auth/refresh (per client IP per minute).
application.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:10}

# Daily purge of expired/revoked token rows older than the retention window.
app.tokens.purge-cron=${TOKENS_PURGE_CRON:0 0 3 * * *}
app.tokens.purge-retention-days=${TOKENS_PURGE_RETENTION_DAYS:30}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#Configuracion supabase

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool sized for Supabase free tier (very few concurrent connections).
# max-lifetime stays below the server-side idle disconnect window.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Graceful shutdown: drain in-flight requests before exiting.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Configuración de JPA
# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Baseline an existing non-empty schema (current prod DB) instead of failing;
# V1 is marked as applied on that DB and only runs on fresh databases.
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/{vendor}

# Límites de subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Wikisource (historias clásicas)
wikisource.api.base-url=${WIKISOURCE_API_BASE_URL:https://es.wikisource.org}
wikisource.user-agent=${WIKISOURCE_USER_AGENT:EcosDeHalloween/0.1}
classic.cache.ttl=${CLASSIC_CACHE_TTL:86400000}
classic.min-body-length=${CLASSIC_MIN_BODY_LENGTH:1000}

# puerto de ejecución
server.port=8080
