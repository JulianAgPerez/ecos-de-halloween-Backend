name: Keep Render alive (backup)
on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Backup keep-alive. The primary cron lives in Cron-job.org/UptimeRobot.
      # --fail makes HTTP >= 400 (and connect errors) fail the step instead of
      # reporting a green run. Timeout budget: worst case is 3 attempts x 60s
      # plus retry delays, ~190s total, which fits timeout-minutes: 6.
      - name: Ping backend
        run: curl --fail --show-error --silent -m 60 --retry 2 --retry-delay 5 -o /dev/null https://ecos-de-halloween.onrender.com/health
