name: Keep Render alive
on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend
        run: curl -sS -m 60 -o /dev/null -w "%{http_code}" https://ecos-de-halloween.onrender.com/api/classics
