name: Keep Render alive (backup)
on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Backup del keep-alive. El cron principal vive en Cron-job.org/UptimeRobot
      # (disparo a nivel minuto, fuera de la cola de GitHub Actions).
      # Cold starts de Render free pueden superar 60s, por eso -m 300 + retries.
      - name: Ping backend
        run: curl -sS -m 300 --retry 2 --retry-delay 5 -o /dev/null -w "%{http_code}" https://ecos-de-halloween.onrender.com/health
